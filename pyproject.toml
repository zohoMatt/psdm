[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "psdm"
dynamic = ["version"]
description = "Pore and Surface Diffusion Model (PSDM) for fixed-bed granular activated carbon adsorbers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Zuo" }]
requires-python = ">=3.10"
keywords = ["adsorption", "activated carbon", "GAC", "PSDM", "water treatment", "PFAS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
plot = ["matplotlib>=3.6"]

[project.urls]
Documentation = "https://psdm.readthedocs.io"
Source = "https://github.com/zohoMatt/psdm"
Issues = "https://github.com/zohoMatt/psdm/issues"
Changelog = "https://github.com/zohoMatt/psdm/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "openpyxl>=3.0",
    "matplotlib>=3.6",
]
docs = [
    "sphinx>=7",
    "furo>=2024.1.29",
    "myst-parser>=3",
    "openpyxl>=3.0",
    "matplotlib>=3.6",
]

[tool.hatch.version]
path = "src/psdm/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs/_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "PD002", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/data/reference/generate*.py" = ["E402", "E501", "B", "UP", "RUF"]
"scripts/benchmark.py" = ["E501"]  # inline CSS/HTML

[tool.coverage.run]
source = ["psdm"]
